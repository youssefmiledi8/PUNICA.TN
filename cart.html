<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panier — PUNICA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header id="siteHeader" class="scrolled">
  <nav>
    <a href="index.html" class="logo">
      <svg class="logo-mark" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="22" cy="22" r="20.4" stroke="currentColor" stroke-width="1.3"/>
        <g stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
          <line x1="22" y1="12.5" x2="22" y2="8.5"/>
          <line x1="18.6" y1="13.2" x2="16.2" y2="9.6"/>
          <line x1="25.4" y1="13.2" x2="27.8" y2="9.6"/>
        </g>
        <text x="22" y="31.5" text-anchor="middle" font-family="Fraunces, serif" font-weight="600" font-size="19" fill="currentColor">P</text>
      </svg>
      <span class="logo-word">PUNICA<span>Tunis, depuis la côte</span></span>
    </a>
    <div class="nav-links">
      <a href="shop.html"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 7h12l-1.2 12.2a2 2 0 0 1-2 1.8H9.2a2 2 0 0 1-2-1.8L6 7Z"/><path d="M9 7V5.5A3 3 0 0 1 12 2.5a3 3 0 0 1 3 3V7"/></svg>Boutique</a>
      <a href="index.html#collections"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3.5" y="3.5" width="7" height="7" rx="1"/><rect x="13.5" y="3.5" width="7" height="7" rx="1"/><rect x="3.5" y="13.5" width="7" height="7" rx="1"/><rect x="13.5" y="13.5" width="7" height="7" rx="1"/></svg>Collections</a>
      <a href="index.html#heritage"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 20V11a8 8 0 0 1 16 0v9"/><line x1="4" y1="20" x2="20" y2="20"/></svg>Héritage</a>
      <a href="index.html#contact"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 6.5 12 13 21 6.5"/></svg>Contact</a>
    </div>
    <div class="nav-right">
      <div class="search-wrap">
        <button type="button" class="icon-btn" id="searchToggle" aria-label="Rechercher">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.2" y2="16.2"/></svg>
        </button>
        <form class="search-form" id="searchForm">
          <input type="text" id="searchInput" placeholder="Rechercher...">
          <button type="submit">OK</button>
        </form>
      </div>
      <a href="cart.html" class="icon-btn cart-link" aria-label="Panier">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 7h12l-1.2 12.2a2 2 0 0 1-2 1.8H9.2a2 2 0 0 1-2-1.8L6 7Z"/><path d="M9 7V5.5A3 3 0 0 1 12 2.5a3 3 0 0 1 3 3V7"/></svg>
        <span class="cart-badge" id="cartBadge">0</span>
      </a>
      <a href="shop.html" class="btn">Voir les nouveautés</a>
      <div class="burger" id="burger"><span></span><span></span><span></span></div>
    </div>
  </nav>
</header>

<section class="cart-page">
  <h1>Votre panier</h1>
  <div class="cart-layout">
    <div class="cart-items" id="cartItems"></div>

    <div class="cart-summary">
      <h3>Récapitulatif</h3>
      <div class="summary-row"><span>Sous-total</span><span id="sumSubtotal">0 DT</span></div>
      <div class="summary-row"><span>Livraison</span><span id="sumShipping">0 DT</span></div>
      <div class="summary-row total"><span>Total</span><span id="sumTotal">0 DT</span></div>

      <button class="btn" id="checkoutBtn" style="width:100%; margin-top:16px;">Passer commande</button>

      <form class="checkout-form" id="checkoutForm">
        <input type="text" placeholder="Nom" required>
        <input type="text" placeholder="Prénom" required>
        <input type="text" placeholder="Adresse complète" required>
        <input type="tel" placeholder="Numéro de téléphone" required>
        <button class="btn" type="submit">Confirmer la commande</button>
      </form>

      <div class="order-confirmed" id="orderConfirmed">
        <div class="check">✓</div>
        <p>Commande confirmée. Un e-mail de confirmation arrive dans votre boîte.</p>
      </div>
    </div>
  </div>
</section>

<footer id="contact">
  <div class="wrap">
    <div class="footer-bottom" style="border-top:1px solid rgba(173,223,241,0.16); padding-top:26px;">
      <span>© 2026 PUNICA. Tous droits réservés.</span>
      <span>Fait sur la côte.</span>
    </div>
  </div>
</footer>

<script src="cart.js"></script>
<script>
  const header = document.getElementById('siteHeader');
  window.addEventListener('scroll', () => header.classList.toggle('scrolled', window.scrollY > 12 || true));

  const burger = document.getElementById('burger');
  const navLinks = document.querySelector('.nav-links');
  burger.addEventListener('click', () => {
    const open = navLinks.style.display === 'flex';
    navLinks.style.display = open ? 'none' : 'flex';
    navLinks.style.flexDirection = 'column';
    navLinks.style.position = 'absolute';
    navLinks.style.top = '64px';
    navLinks.style.left = '0';
    navLinks.style.right = '0';
    navLinks.style.background = 'var(--cream)';
    navLinks.style.padding = '20px 32px';
    navLinks.style.gap = '18px';
    navLinks.style.borderBottom = '1px solid var(--line)';
  });

  const searchToggle = document.getElementById('searchToggle');
  const searchForm = document.getElementById('searchForm');
  searchToggle.addEventListener('click', () => {
    searchForm.classList.toggle('open');
    if (searchForm.classList.contains('open')) document.getElementById('searchInput').focus();
  });
  searchForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const q = document.getElementById('searchInput').value.trim();
    if (q) window.location.href = 'shop.html?q=' + encodeURIComponent(q);
  });

  const SHIPPING = 8;
  const itemsEl = document.getElementById('cartItems');
  const checkoutBtn = document.getElementById('checkoutBtn');
  const checkoutForm = document.getElementById('checkoutForm');
  const orderConfirmed = document.getElementById('orderConfirmed');

  function renderCart() {
    const cart = getCart();
    if (cart.length === 0) {
      itemsEl.innerHTML = `<div class="empty-cart"><p>Votre panier est vide. <a href="shop.html">Découvrir la boutique →</a></p></div>`;
      checkoutBtn.style.display = 'none';
      updateTotals(0);
      return;
    }
    checkoutBtn.style.display = 'block';

    itemsEl.innerHTML = cart.map(item => {
      const p = PUNICA_PRODUCTS.find(pr => pr.id === item.id);
      if (!p) return '';
      return `
        <div class="cart-row" data-id="${p.id}" data-size="${item.size}">
          <div class="row-media">${productImgHTML(p)}</div>
          <div class="info">
            <h4>${p.name}</h4>
            <div class="row-size">Taille : ${item.size}</div>
            <div class="row-remove" data-remove="${p.id}" data-size="${item.size}">Retirer</div>
          </div>
          <div class="qty-control">
            <button data-dec="${p.id}" data-size="${item.size}">−</button>
            <span>${item.qty}</span>
            <button data-inc="${p.id}" data-size="${item.size}">+</button>
          </div>
          <div class="row-price">${p.price * item.qty} DT</div>
        </div>
      `;
    }).join('');

    const subtotal = cart.reduce((sum, item) => {
      const p = PUNICA_PRODUCTS.find(pr => pr.id === item.id);
      return sum + (p ? p.price * item.qty : 0);
    }, 0);
    updateTotals(subtotal);

    itemsEl.querySelectorAll('[data-inc]').forEach(b => b.addEventListener('click', () => {
      const item = getCart().find(i => i.id === b.dataset.inc && i.size === b.dataset.size);
      setQty(b.dataset.inc, b.dataset.size, item.qty + 1);
      renderCart();
    }));
    itemsEl.querySelectorAll('[data-dec]').forEach(b => b.addEventListener('click', () => {
      const item = getCart().find(i => i.id === b.dataset.dec && i.size === b.dataset.size);
      if (item.qty <= 1) { removeFromCart(b.dataset.dec, b.dataset.size); } else { setQty(b.dataset.dec, b.dataset.size, item.qty - 1); }
      renderCart();
    }));
    itemsEl.querySelectorAll('[data-remove]').forEach(b => b.addEventListener('click', () => {
      removeFromCart(b.dataset.remove, b.dataset.size);
      renderCart();
    }));
  }

  function updateTotals(subtotal) {
    const shipping = subtotal > 0 ? SHIPPING : 0;
    document.getElementById('sumSubtotal').textContent = subtotal + ' DT';
    document.getElementById('sumShipping').textContent = shipping + ' DT';
    document.getElementById('sumTotal').textContent = (subtotal + shipping) + ' DT';
  }

  checkoutBtn.addEventListener('click', () => {
    checkoutForm.classList.add('open');
    checkoutBtn.style.display = 'none';
  });

  checkoutForm.addEventListener('submit', (e) => {
    e.preventDefault();
    checkoutForm.classList.remove('open');
    itemsEl.innerHTML = '';
    document.querySelector('.cart-summary h3').style.display = 'none';
    document.querySelectorAll('.summary-row').forEach(el => el.style.display = 'none');
    orderConfirmed.classList.add('show');
    saveCart([]);
  });

  renderCart();
</script>

</body>
</html>
